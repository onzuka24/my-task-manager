[package]
name = "my-task-manager"
version = "0.1.0"
description = "タスクとタスクの「あいだ」を扱う常駐ツール"
authors = ["onzuka"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "my_task_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

# バージョンはすべて `=` で厳密に固定する。`@latest` / `@next` 相当の解決で 3.x 系を
# 引くことを避けるため (Tauri 3.0.0-alpha および tauri-plugin-single-instance
# 3.0.0-alpha は公開済みだが v1 は 2.x 系に留まる)。
#
# tauri の feature:
#   tray-icon — メニューバー項目 (NSStatusItem)。唯一の明示的な終了経路 (CAP-3)
#   image-png — Image::from_bytes。上の 2 つは既定 feature に含まれない
#   macos-private-api — 非活性パネル (AD-6) に必須。tauri-nspanel が要求するため
#     feature の加算でどのみち有効になるが、tauri-build は Cargo.toml の feature と
#     tauri.conf.json の許可リストの一致を検査する。明示しないとビルドが落ちる。
#     これにより App Store 配布は恒久的に不可能となる (SPEC 非目標)。
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.34"
tauri = { version = "=2.11.5", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-plugin-log = "=2.9.1"
# SQLite。`bundled` は SQLite 自体をソースから同梱してビルドする — システム同梱版の
# バージョン差 (macOS のリリースごとに異なる) を排除し、WAL や upsert の挙動を固定
# するため。`tauri-plugin-sql` と sqlx は使わない (AD-4: SQL はストレージアダプタに
# 閉じる / sqlx は async ランタイムをコアへ持ち込む)。
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# ID は UUID v7 (スパイン「一貫性の規約」)。`v7` は生成器、`serde` は将来のコマンド
# 境界 (AD-3) で ID をそのまま運ぶため。
uuid = { version = "=1.26.1", features = ["v7", "serde"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "=2.3.2"
# 二重起動を許さない。後発は自ら終了し、先発が応答する。二重起動は待機時
# フットプリントを倍にし AD-14 の実測を無効化する。
tauri-plugin-single-instance = "=2.4.4"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-autostart = "=2.5.1"

# フルスクリーン空間でオーバーレイを出すための NSWindow 直接操作に使う。
# tao の set_visible_on_all_workspaces は CanJoinAllSpaces しか立てず、
# FullScreenAuxiliary は tauri.conf.json にも tao にも存在しない。
# バージョンは Tauri 2.11.5 自身の依存に合わせる — ずらすと crate が二重になり
# リンクが壊れる。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow", "NSResponder"] }
# 非活性パネル (AD-6) — Tauri 2.11 に一次的な API は無く、NSPanel への差し替えを
# 行うのはこのクレートだけである。`=` で固定するのは他の依存と同じ理由 (2.x 系に
# 留まる) に加え、パネルの style mask と collection behavior の意味が版で変わると
# 「三つの必須設定」が静かに失敗しうるためである。
#
# このクレートは tauri の `macos-private-api` feature を要求する。feature は加算的で
# あり、結果として本体にも有効化される — tauri.conf.json の `app.macOSPrivateApi` を
# 真にしないとビルドが通らない。App Store 配布が恒久的に不可能になることは、AD-6 を
# 採用した時点で確定している (スパイン「スタック」)。
tauri-nspanel = "=2.1.0"


# テストでのみ使う。Rust → TS の配線 (フィールド名) を JSON の形として固定するため。
[dev-dependencies]
serde_json = "=1.0.151"
